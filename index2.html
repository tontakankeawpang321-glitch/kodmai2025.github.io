<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Thai Law Lite – คลังเอกสาร</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{font-family:Sarabun,sans-serif;margin:0;background:#f3f4f6;color:#1f2937}
header{background:linear-gradient(135deg,#172554,#1e3a8a);color:#fff;padding:20px}
.container{max-width:960px;margin:-20px auto 60px;padding:0 16px}

.search,.toolbar{background:#fff;border-radius:14px;padding:10px 14px;margin-bottom:10px}
.search input{width:100%;border:none;outline:none;font-size:15px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,button.ai-btn{
  padding:6px 12px;border-radius:8px;border:1px solid #e5e7eb;
  background:#fff;cursor:pointer;font-size:14px
}

.breadcrumb{font-size:13px;margin:8px 0 14px;color:#374151;display:flex;gap:10px;align-items:center}
.breadcrumb span{cursor:pointer;color:#1e3a8a;font-weight:600}

.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;
border:1px solid #e5e7eb;display:flex;justify-content:space-between;gap:12px}
.info{flex:1;min-width:0}
.info h3{margin:0 0 6px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:#6b7280}

.btn{background:#e0ecff;color:#1e3a8a;padding:6px 14px;border-radius:999px;
border:none;font-size:13px;font-weight:600;cursor:pointer}

.loading{text-align:center;padding:40px;color:#6b7280}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:1000}
.modal-box{background:#fff;max-width:700px;margin:8% auto;border-radius:14px;
padding:16px;max-height:80vh;overflow:auto}
.modal-box h3{margin-top:0}
.modal-close{float:right;cursor:pointer;font-weight:700}
</style>
</head>

<body>

<header>
  <h1>📁 Thai Law Lite</h1>
  <p>คลังเอกสารกฎหมาย + AI</p>
</header>

<div class="container">

  <div class="search">
    <input id="searchInput" placeholder="ค้นหาไฟล์หรือโฟลเดอร์..." />
  </div>

  <div class="toolbar">
    <select id="sortSelect">
      <option value="new">ไฟล์ใหม่ล่าสุด</option>
      <option value="old">ไฟล์เก่าที่สุด</option>
      <option value="az">ชื่อ A–Z</option>
      <option value="za">ชื่อ Z–A</option>
    </select>

    <select id="categorySelect">
      <option value="all">ทุกหมวด</option>
    </select>

    <button class="ai-btn" onclick="summarizeCategory()">
      🤖 AI สรุปไฟล์ในหมวดนี้
    </button>
  </div>

  <div class="breadcrumb">
    <span onclick="goHome()">🏠 หน้าแรก</span>
    <span onclick="goBack()">⬅️ ย้อนกลับ</span>
    <span id="currentPath"></span>
  </div>

  <div id="list"></div>
  <div id="loading" class="loading">กำลังโหลด...</div>
</div>

<!-- AI Modal -->
<div id="aiModal" class="modal">
  <div class="modal-box">
    <span class="modal-close" onclick="closeAI()">✕</span>
    <h3>🤖 AI สรุปไฟล์</h3>
    <div id="aiResult">กำลังประมวลผล...</div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyngJX9yx-QZgwA6wCTiCwJcVB5xmpXwBTgpZWk_duN8OlYfB3lcn1XGBCig5dqyW7d/exec";
const ROOT_FOLDER_ID = "1zY7CDFyad6PQn-FzM9hVFn_CTIEb-fbO";
const BACKEND_URL = "https://us-central1-law-ai-14740.cloudfunctions.net/api/chat";
/* ========================================= */

let stack=[{id:ROOT_FOLDER_ID,name:"หน้าแรก"}];
let items=[];
let currentCategory="all";

const listEl=document.getElementById("list");
const loadingEl=document.getElementById("loading");
const searchInput=document.getElementById("searchInput");
const sortSelect=document.getElementById("sortSelect");
const categorySelect=document.getElementById("categorySelect");
const currentPath=document.getElementById("currentPath");

/* ===== Utils ===== */
function extractBEYear(name){
  const m=name.match(/25\d{2}/);
  return m?parseInt(m[0]):0;
}

/* ===== Navigation ===== */
function loadFolder(id,name){
  loadingEl.style.display="block";
  if(name) stack.push({id,name});
  currentPath.textContent = stack.map(s=>s.name).join(" / ");

  fetch(`${SCRIPT_URL}?folder=${id}`)
    .then(r=>r.json())
    .then(d=>{
      items=d;
      render();
      if(stack.length===1){
        categorySelect.innerHTML=`<option value="all">ทุกหมวด</option>`;
        d.filter(i=>i.isFolder).forEach(f=>{
          const o=document.createElement("option");
          o.value=f.name;o.textContent=f.name;
          categorySelect.appendChild(o);
        });
      }
      loadingEl.style.display="none";
    });
}

function goHome(){
  stack=[{id:ROOT_FOLDER_ID,name:"หน้าแรก"}];
  loadFolder(ROOT_FOLDER_ID);
}
function goBack(){
  if(stack.length>1){
    stack.pop();
    loadFolder(stack[stack.length-1].id);
  }
}

/* ===== Sorting + Render ===== */
function sortItems(arr){
  const m=sortSelect.value;
  return [...arr].sort((a,b)=>{
    if(m==="az") return a.name.localeCompare(b.name,"th");
    if(m==="za") return b.name.localeCompare(a.name,"th");
    return extractBEYear(b.name)-extractBEYear(a.name);
  });
}

function render(){
  listEl.innerHTML="";
  let filtered=items.filter(i=>i.name.toLowerCase().includes(searchInput.value.toLowerCase()));
  if(currentCategory!=="all"){
    filtered=filtered.filter(i=>i.name===currentCategory||i.parentName===currentCategory);
  }
  filtered=sortItems(filtered);

  if(filtered.length===0){
    listEl.innerHTML=`<div class="loading">ไม่พบไฟล์</div>`;
    return;
  }

  filtered.forEach(it=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="info">
        <h3>${it.isFolder?"📁":"📄"} ${it.name}</h3>
        <div class="meta">${it.isFolder?"โฟลเดอร์":`พ.ศ. ${extractBEYear(it.name)||"ไม่ระบุ"}`}</div>
      </div>
    `;
    const btn=document.createElement("button");
    btn.className="btn";
    btn.textContent=it.isFolder?"เปิดโฟลเดอร์":"เปิดไฟล์";
    btn.onclick=()=>it.isFolder?loadFolder(it.id,it.name):window.open(it.url,"_blank");
    card.appendChild(btn);
    listEl.appendChild(card);
  });
}

/* ===== AI Summary ===== */
function summarizeCategory(){
  const files=items.filter(i=>!i.isFolder).map(f=>f.name).join(", ");
  document.getElementById("aiModal").style.display="block";
  document.getElementById("aiResult").textContent="กำลังสรุป...";

  fetch(BACKEND_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      history:[{
        role:"user",
        parts:[{text:`ช่วยสรุปภาพรวมไฟล์ในหมวด "${currentCategory}" จากรายการต่อไปนี้: ${files}`}]
      }]
    })
  })
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("aiResult").textContent=d.reply||"ไม่สามารถสรุปได้";
  });
}
function closeAI(){
  document.getElementById("aiModal").style.display="none";
}

/* ===== Events ===== */
searchInput.oninput=render;
sortSelect.onchange=render;
categorySelect.onchange=()=>{
  currentCategory=categorySelect.value;
  render();
};

/* ===== Init ===== */
loadFolder(ROOT_FOLDER_ID);
</script>

</body>
</html>
