<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Thai Law Lite – Google Drive File Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{font-family:Sarabun,sans-serif;margin:0;background:#f3f4f6;color:#1f2937}
header{background:linear-gradient(135deg,#172554,#1e3a8a);color:#fff;padding:20px}
.container{max-width:960px;margin:-20px auto 60px;padding:0 16px}

.search, .toolbar{background:#fff;border-radius:14px;padding:10px 14px;margin-bottom:10px}
.search input{width:100%;border:none;outline:none;font-size:15px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap}
select{padding:6px 10px;border-radius:8px;border:1px solid #e5e7eb}

.breadcrumb{font-size:13px;margin:8px 0 14px;color:#374151}
.breadcrumb span{cursor:pointer;color:#1e3a8a}

.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;
border:1px solid #e5e7eb;display:flex;justify-content:space-between;gap:12px}
.info{flex:1;min-width:0}
.info h3{margin:0 0 6px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:#6b7280}

.btn{background:#e0ecff;color:#1e3a8a;padding:6px 14px;border-radius:999px;
border:none;font-size:13px;font-weight:600;cursor:pointer}

.loading{text-align:center;padding:40px;color:#6b7280}

/* Slider */
.slider{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.slider-item{min-width:220px;background:#fff;border:1px solid #e5e7eb;
border-radius:12px;padding:12px;cursor:pointer}

/* Modal Preview */
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:1000}
#viewerBox{position:absolute;inset:5%;background:#fff;border-radius:12px;overflow:hidden}
#viewerClose{position:absolute;top:10px;right:10px;background:#111;color:#fff;
border:none;border-radius:999px;padding:6px 10px;cursor:pointer;z-index:10}
#viewerFrame{width:100%;height:100%;border:none}
</style>
</head>

<body>

<header>
  <h1>📁 Thai Law Lite</h1>
  <p>คลังเอกสารกฎหมาย (Google Drive)</p>
</header>

<div class="container">

  <div class="search">
    <input id="searchInput" placeholder="ค้นหาไฟล์หรือโฟลเดอร์..." />
  </div>

  <div class="toolbar">
    <select id="sortSelect">
      <option value="new">ไฟล์ใหม่ล่าสุด</option>
      <option value="old">ไฟล์เก่าที่สุด</option>
      <option value="az">ชื่อ A–Z</option>
      <option value="za">ชื่อ Z–A</option>
    </select>
  </div>

  <h3>🆕 ไฟล์อัปโหลดใหม่</h3>
  <div id="slider" class="slider"></div>

  <div id="breadcrumb" class="breadcrumb"></div>
  <div id="list"></div>
  <div id="loading" class="loading">กำลังโหลด...</div>
</div>

<!-- Modal Preview -->
<div id="viewer">
  <div id="viewerBox">
    <button id="viewerClose" onclick="closeViewer()">✕</button>
    <iframe id="viewerFrame"></iframe>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyngJX9yx-QZgwA6wCTiCwJcVB5xmpXwBTgpZWk_duN8OlYfB3lcn1XGBCig5dqyW7d/exec";
const ROOT_FOLDER_ID = "1zY7CDFyad6PQn-FzM9hVFn_CTIEb-fbO";
/* ========================================= */

let stack=[{id:ROOT_FOLDER_ID,name:"Root"}];
let items=[];
const listEl=document.getElementById("list");
const sliderEl=document.getElementById("slider");
const loadingEl=document.getElementById("loading");
const breadcrumbEl=document.getElementById("breadcrumb");
const searchInput=document.getElementById("searchInput");
const sortSelect=document.getElementById("sortSelect");

function extractBEYear(name){
  const m=name.match(/25\d{2}/);
  return m?parseInt(m[0]):null;
}

function loadFolder(id,name){
  loadingEl.style.display="block";
  if(name) stack.push({id,name});
  breadcrumbEl.innerHTML=stack.map((s,i)=>`<span onclick="go(${i})">${s.name}</span>`).join(" / ");
  fetch(`${SCRIPT_URL}?folder=${id}`)
    .then(r=>r.json())
    .then(d=>{
      items=d;
      render();
      renderSlider();
      loadingEl.style.display="none";
    });
}

function go(i){
  stack=stack.slice(0,i+1);
  loadFolder(stack[i].id);
}

function sortItems(arr){
  const mode=sortSelect.value;
  return [...arr].sort((a,b)=>{
    if(mode==="az") return a.name.localeCompare(b.name,"th");
    if(mode==="za") return b.name.localeCompare(a.name,"th");
    const ya=extractBEYear(a.name)||0;
    const yb=extractBEYear(b.name)||0;
    return mode==="new"?yb-ya:ya-yb;
  });
}

function render(){
  listEl.innerHTML="";
  const q=searchInput.value.toLowerCase();
  const filtered=sortItems(items.filter(i=>i.name.toLowerCase().includes(q)));

  if(filtered.length===0){
    listEl.innerHTML=`<div class="loading">ไม่พบไฟล์</div>`;
    return;
  }

  filtered.forEach(it=>{
    const year=extractBEYear(it.name);
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="info">
        <h3>${it.isFolder?"📁":"📄"} ${it.name}</h3>
        <div class="meta">
          ${it.isFolder?"โฟลเดอร์":year?`พ.ศ. ${year}`:"ไม่ระบุปี"}
        </div>
      </div>
    `;
    const btn=document.createElement("button");
    btn.className="btn";
    if(it.isFolder){
      btn.textContent="เปิดโฟลเดอร์";
      btn.onclick=()=>loadFolder(it.id,it.name);
    }else{
      btn.textContent="เปิดไฟล์";
      btn.onclick=()=>openFile(it.id);
    }
    card.appendChild(btn);
    listEl.appendChild(card);
  });
}

function renderSlider(){
  sliderEl.innerHTML="";
  const latest=sortItems(items.filter(i=>!i.isFolder)).slice(0,5);
  latest.forEach(f=>{
    const box=document.createElement("div");
    box.className="slider-item";
    box.innerHTML=`<strong>📄 ${f.name}</strong>`;
    box.onclick=()=>openFile(f.id);
    sliderEl.appendChild(box);
  });
}

function openFile(id){
  document.getElementById("viewer").style.display="block";
  document.getElementById("viewerFrame").src=`https://drive.google.com/file/d/${id}/preview`;
}
function closeViewer(){
  document.getElementById("viewer").style.display="none";
  document.getElementById("viewerFrame").src="";
}

searchInput.oninput=render;
sortSelect.onchange=render;

loadFolder(ROOT_FOLDER_ID,"Root");
</script>

</body>
</html>
