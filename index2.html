<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Thai Law Lite – คลังเอกสาร</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link href="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" rel="stylesheet">

  <style>
    body {
      font-family: "Sarabun", sans-serif;
      background: #f3f4f6;
      margin: 0;
      color: #1f2937;
    }

    header {
      background: linear-gradient(135deg, #172554, #1e3a8a);
      color: white;
      padding: 24px;
      border-radius: 0 0 24px 24px;
    }

    .container {
      max-width: 900px;
      margin: -20px auto 40px;
      padding: 0 16px;
    }

    .search {
      background: white;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
    }

    .categories button {
      border: 1px solid #ddd;
      background: white;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
    }

    .categories button.active {
      background: #1e3a8a;
      color: white;
      border-color: #1e3a8a;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #eee;
    }

    .card h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .meta {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .desc {
      font-size: 14px;
      color: #4b5563;
      margin-bottom: 10px;
    }

    .open {
      display: block;
      text-align: center;
      background: #e0ecff;
      color: #1e3a8a;
      padding: 8px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }
  </style>
</head>
<body>

<header>
  <h1>📁 Thai Law Lite</h1>
  <p>คลังเอกสารกฎหมาย (ข้อมูลจาก Google Drive)</p>
</header>

<div class="container">

  <div class="search">
    <input type="text" id="searchInput" placeholder="ค้นหาชื่อเอกสาร..." />
  </div>

  <div class="categories" id="categoryBar"></div>

  <div id="list"></div>
  <div id="loading" class="loading">กำลังโหลดข้อมูล...</div>

</div>

<script>
/* ================================
   🔧 แก้ตรงนี้จุดเดียว
================================ */
const SHEET_ID = "1D4fJ_o1YFW7cmA351i-JawvZJL8ljbi98KADxXc6bhU";
const SHEET_NAME = "ชีต1";
const DATA_URL = `https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`;

/* ================================ */

let allFiles = [];
let currentCategory = "All";

const listEl = document.getElementById("list");
const loadingEl = document.getElementById("loading");
const categoryBar = document.getElementById("categoryBar");
const searchInput = document.getElementById("searchInput");

fetch(DATA_URL)
  .then(res => res.json())
  .then(data => {
    allFiles = data;
    renderCategories();
    renderList();
    loadingEl.style.display = "none";
  })
  .catch(err => {
    loadingEl.innerText = "โหลดข้อมูลไม่สำเร็จ";
    console.error(err);
  });

function renderCategories() {
  const folders = ["All", ...new Set(allFiles.map(f => f.folder || "ทั่วไป"))];
  categoryBar.innerHTML = "";

  folders.forEach(cat => {
    const btn = document.createElement("button");
    btn.textContent = cat === "All" ? "ทั้งหมด" : cat;
    btn.className = cat === currentCategory ? "active" : "";
    btn.onclick = () => {
      currentCategory = cat;
      renderCategories();
      renderList();
    };
    categoryBar.appendChild(btn);
  });
}

function renderList() {
  const keyword = searchInput.value.toLowerCase();
  listEl.innerHTML = "";

  const filtered = allFiles.filter(f => {
    const matchText =
      f.name.toLowerCase().includes(keyword) ||
      (f.description && f.description.toLowerCase().includes(keyword));
    const matchCat =
      currentCategory === "All" || f.folder === currentCategory;
    return matchText && matchCat;
  });

  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="loading">ไม่พบเอกสาร</div>`;
    return;
  }

  filtered.forEach(f => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h3>${f.name}</h3>
      <div class="meta">หมวด: ${f.folder || "ทั่วไป"}</div>
      <div class="desc">${f.description || ""}</div>
      <a class="open" href="${f.url}" target="_blank">เปิดดูเอกสาร</a>
    `;
    listEl.appendChild(card);
  });
}

searchInput.addEventListener("input", renderList);
</script>

</body>
</html>
